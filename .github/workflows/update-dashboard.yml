name: Actualizar dashboard Mendel

on:
  schedule:
    # Corre todos los días a las 07:00 UTC (≈ 01:00 hora Ciudad de México, ajustar si querés otro horario)
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # permite tocar "Run workflow" manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Traer datos frescos de HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/fetch_hubspot.py

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/closed.json data/meta.json
          git diff --staged --quiet || git commit -m "Actualización automática de pipeline $(date -u +%Y-%m-%d)"
          git push

  deploy-pages:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo (con el commit ya actualizado)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4
